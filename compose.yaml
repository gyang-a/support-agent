name: support-agent

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend:
    <<: *common
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *common
    init: true
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in .env}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      MYSQL_URL: "mysql+asyncmy://support:${MYSQL_PASSWORD:?Use a URL-safe password}@mysql:3306/digital_agent?charset=utf8mb4"
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_DAYS: "7"
      EMBEDDING_API_KEY: ${SILICONFLOW_API_KEY:?Set SILICONFLOW_API_KEY in .env}
      EMBEDDING_BASE_URL: https://api.siliconflow.cn/v1
      EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      EMBEDDING_DIMENSION: "1024"
      EMBEDDING_NAMESPACE: sf_qwen3_06b_v1
      EMBEDDING_TIMEOUT: "30"
      RERANKER_PROVIDER: siliconflow
      RERANKER_API_KEY: ${SILICONFLOW_API_KEY:?Set SILICONFLOW_API_KEY in .env}
      RERANKER_BASE_URL: https://api.siliconflow.cn/v1
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      RERANKER_TIMEOUT: "15"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    volumes:
      - agent-runtime:/app/agent/runtime
      - agent-data:/app/agent/data
    depends_on:
      data-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5

  # Runs once before the backend; never calls an LLM or re-embeds documents.
  data-init:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: "no"
    command: ["python", "agent/scripts/deployment_data.py", "restore", "/snapshot"]
    environment:
      MYSQL_URL: "mysql+asyncmy://support:${MYSQL_PASSWORD:?Use a URL-safe password}@mysql:3306/digital_agent?charset=utf8mb4"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    volumes:
      - type: bind
        source: ./deployment-data/snapshot
        target: /snapshot
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy

  mysql:
    <<: *common
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: digital_agent
      MYSQL_USER: support
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Use a URL-safe password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u support digital_agent -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  etcd:
    <<: *common
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *common
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-supportminio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    <<: *common
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${MINIO_USER:-supportminio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 10

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
  agent-runtime:
  agent-data:
